<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form-Login</title>
    <link rel="stylesheet" href="style.4.css" />
    <script src="script.js"></script>
</head>
<body class="body">
    <h1 class="h1">Login ke Akun Anda</h1>
    <form class="form" action="/proses-daftar" method="POST">

        <label for="email">Alamat Email:</label><br />
        <input class="input"
          type="email"
          id="email"
          name="email"
          placeholder="david343@gmail.com"
          required
        /><br /><br />

        <label for="password">Password:</label><br />
        <input class="input"
          type="password"
          id="password"
          name="password"
          placeholder="********"
          required
        /><br /><br />

        <label
          ><input class="check"
          type="checkbox"/> Ingat Saya </label>
          <br /><br />
         <button class="button" type="submit" value="Kirim"> Masuk</button>
         <p>
        Belum punya akun?
        <a href="#">Daftar di sini</a>.
      </p>

</body>
</html>
